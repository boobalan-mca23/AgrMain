<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      background-color: #0f0f1a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag; /* Allows dragging the window */
      user-select: none;
    }
    
    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .logo-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 8px;
    }

    /* Glowing animated outer ring */
    .spinner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(224, 169, 109, 0.1);
      border-top-color: #e0a96d; /* Warm gold branding color */
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.55, 0.085, 0.68, 0.53) infinite;
      box-shadow: 0 0 15px rgba(224, 169, 109, 0.2);
    }

    /* Inner logo container */
    .logo-icon {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, rgba(30, 30, 50, 0.8) 0%, rgba(15, 15, 26, 1) 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 1px;
      margin: 0;
      background: linear-gradient(135deg, #ffffff 0%, #a5a5b5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status {
      font-size: 13px;
      color: #8b8ba0;
      margin: 0;
      font-weight: 400;
      letter-spacing: 0.5px;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Close Button Styling */
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: none;
      color: #8b8ba0;
      font-size: 18px;
      font-weight: 300;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      -webkit-app-region: no-drag; /* Exclude from dragging region to allow clicks */
      transition: background 0.2s ease, color 0.2s ease;
      z-index: 9999;
    }
    .close-btn:hover {
      background: rgba(220, 53, 69, 0.2); /* Crimson tint */
      color: #ff4d4d;
    }
    .close-btn:active {
      background: rgba(220, 53, 69, 0.4);
    }
  </style>
</head>
<body>
  <!-- Custom Close Button for Frameless Window -->
  <button class="close-btn" onclick="closeApp()" title="Close Application">&times;</button>

  <div class="container">
    <div class="logo-container">
      <div class="spinner"></div>
      <div class="logo-icon">
        <img class="logo-img" src="../client/dist/app-logo.png" onerror="this.src='../client/public/app-logo.png'; this.onerror=function(){this.style.display='none'; document.getElementById('logo-fallback').style.display='block';};" alt="AGR">
        <span id="logo-fallback" style="display:none; font-size:24px; font-weight:bold; color:#e0a96d; letter-spacing:1px;">AGR</span>
      </div>
    </div>
    <h1 class="title">AGR Jewellery Management</h1>
    <p class="status">Connecting to backend server...</p>
  </div>

  <script>
    function closeApp() {
      if (window.electronAPI && typeof window.electronAPI.closeWindow === 'function') {
        window.electronAPI.closeWindow();
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
